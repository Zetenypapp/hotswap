<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HotSwap</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-top">
      <div class="bgart" id="sideArt"></div>
      <div class="brandrow" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="7" fill="var(--accent)"/><path d="M6.5 9.5h10l-3-3M17.5 14.5h-10l3 3" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>HotSwap</div>
        <button class="ghost" id="backBtn" aria-label="Back" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
        <button class="ghost" id="fwdBtn" aria-label="Forward" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div id="nowCard"></div>
    </div>
    <nav class="mainnav">
      <button data-view="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5L12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>Home</button>
      <button data-view="library"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>Library</button>
      <button data-view="maps"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" opacity=".35"/><path d="M9 4v14l6 2V6z"/></svg>Maps</button>
      <button data-view="mods"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 3h4v3a2 2 0 1 0 4 0V3h3v7h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H3v-7h3a2 2 0 1 0 0-4H3V3z"/></svg>Mods</button>
      <button data-view="overlay"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="4" width="20" height="14" rx="3" opacity=".35"/><rect x="5" y="7" width="9" height="6" rx="2"/></svg>Overlay</button>
    </nav>
    <div class="side-label">
      My games <span class="n" id="gameCount"></span>
      <button class="ghost" id="sortBtn" aria-label="Sort games" title="Sort games"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
    </div>
    <div class="games" id="games"></div>
  </aside>

  <main class="main" id="main">
    <div class="ambient"><div class="layer glow" id="ambGlow"></div><div class="layer" id="ambArt"></div></div>
    <header class="topbar" data-tauri-drag-region>
      <div class="spacer" data-tauri-drag-region></div>
      <button class="home" data-view="home" aria-label="Home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
        <kbd>Ctrl K</kbd>
      </label>
      <div class="spacer" data-tauri-drag-region></div>
      <div class="tb-right" data-tauri-drag-region>
        <button class="update-pill" id="updatePill" hidden></button>
        <button class="home tb-custom" id="customizeBtn" aria-label="Customise this page" title="Customise this page" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg></button>
        <button class="home tb-settings" data-view="settings" aria-label="Settings" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <div class="winctl" id="winctl">
          <button id="winMini" aria-label="Mini mode" title="Mini mode: a small window that stays on top"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor"><rect x=".5" y=".5" width="11" height="11" rx="1"/><rect x="6" y="6" width="4.5" height="4.5" fill="currentColor" stroke="none"/></svg></button>
          <button id="winMin" aria-label="Minimize"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
          <button id="winMax" aria-label="Maximize"><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
          <button id="winClose" class="close" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button>
        </div>
      </div>
    </header>

    <section class="view" id="homeView"><div class="scroll"><div class="home-view" id="homeBody"></div></div></section>
    <section class="view" id="libView"><div class="scroll"><div class="lib-view" id="libBody"></div></div></section>
    <section class="view" id="modsView"><div class="scroll"><div class="lib-view" id="modsBody"></div></div></section>
    <section class="view" id="mapsView"><div class="scroll"><div class="lib-view" id="mapsBody"></div></div></section>
    <section class="view" id="ovView"><div class="scroll"><div class="set-view" id="ovBody"></div></div></section>
    <section class="view" id="setView"><div class="scroll"><div class="set-view" id="setBody"></div></div></section>
    <section class="view" id="gameView">
      <div class="gamehead" id="gamehead"></div>
      <div class="chips" id="chips"></div>
      <div class="content" id="content">
        <div class="mods" id="mods"></div>
        <aside class="panel">
          <div class="card" id="activeCard">
            <h2>Active mods <button id="resetAll">Reset all</button></h2>
            <div class="status" id="status"></div>
            <ul class="active-list" id="activeList"></ul>
          </div>
          <div class="card" id="sessionsCard">
            <h2>Sessions</h2>
            <div class="meta-line" id="sessionsMeta"></div>
            <ul class="active-list" id="sessions"></ul>
          </div>
          <div class="card" id="activityCard">
            <h2>Activity</h2>
            <ul class="log" id="log"></ul>
          </div>
          <div class="card" id="notesCard">
            <h2>Notes</h2>
            <textarea id="notes" placeholder="Seeds, save slots, reminders…"></textarea>
          </div>
        </aside>
      </div>
    </section>
  </main>
</div>
<div class="palette" id="palette" hidden>
  <div class="pal-box" role="dialog" aria-label="Go to">
    <div class="pal-search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="palInput" placeholder="Go to a game, page, mod or action" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="pal-list" id="palList" role="listbox"></div>
  </div>
</div>
<div class="minibox" id="mini"></div>
<div class="palette" id="whatsNew" hidden>
  <div class="pal-box wn-box" role="dialog" aria-labelledby="wnTitle">
    <div class="wn-head"><h2 id="wnTitle">What's new</h2><button class="ghost" id="wnClose" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="wn-body" id="wnBody"></div>
    <div class="wn-foot"><a class="btn" id="wnLink" href="#" target="_blank" rel="noopener">See it on GitHub</a></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="home.js"></script>
<script src="icons.js"></script>
<script src="pages.js"></script>
<script src="ingame.js"></script>
<script src="discord.js"></script>
<script src="stats-shared.js"></script>
<script src="stats.js"></script>
<script src="session.js"></script>
<script src="updates.js"></script>
<script src="hotkeys.js"></script>
<script src="extras.js"></script>
<script src="palette.js"></script>
<script src="events.js"></script>
<script src="boot.js"></script>
</body>
</html>
