<!doctype html>
<html><head><meta charset="utf-8"><title>Hotswap overlay</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: Figtree, system-ui, sans-serif; user-select: none; }
  #stack { position: fixed; top: 14px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .note { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 12px; border-radius: 18px; color: #f2f4f7;
    background: rgba(14, 16, 20, .88); box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
    animation: in .22s ease-out; transition: opacity .3s, transform .3s; }
  .note.out { opacity: 0; transform: translateY(-8px); }
  .logo { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--c, #3ddc84); color: #0d1f14; font-weight: 900; font-size: 15px; }
  .t { display: flex; flex-direction: column; line-height: 1.2; }
  .t b { font-size: 14px; }
  .t span { font-size: 12px; color: #a3aab3; }
  .v { margin-left: 8px; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 800; background: rgba(255,255,255,.1); }
  .v.on { background: var(--c, #3ddc84); color: #0d1f14; }
  @keyframes in { from { opacity: 0; transform: translateY(-10px) scale(.97); } }
</style></head>
<body><div id="stack"></div>
<script>
  // Shows mod changes over the game; the window itself is transparent and ignores the mouse.
  const stack = document.getElementById('stack');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  window.__TAURI__.event.listen('overlay', ({ payload: p }) => {
    document.documentElement.style.setProperty('--c', p.accent || '#3ddc84');
    const n = document.createElement('div');
    n.className = 'note';
    n.innerHTML = `<span class="logo">⇄</span><span class="t"><b>${esc(p.title)}</b><span>${esc(p.game)}</span></span><span class="v${p.on ? ' on' : ''}">${esc(p.value)}</span>`;
    stack.prepend(n);
    while (stack.children.length > 3) stack.lastChild.remove();
    setTimeout(() => { n.classList.add('out'); setTimeout(() => n.remove(), 320); }, 2200);
  });
</script></body></html>
