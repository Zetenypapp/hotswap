<!doctype html>
<html><head><meta charset="utf-8"><title>HotSwap overlay</title>
<style>
  /* One transparent window over the whole screen. It ignores the mouse except while the menu is open. */
  @font-face { font-family: "Figtree"; src: url("fonts/Figtree.ttf") format("truetype"); font-weight: 300 900; }
  :root { --c: #f3b73f; --ink: #1d1404; --panel: rgba(13, 15, 19, .9); --line: rgba(255, 255, 255, .08); --fg: #f2f4f7; --soft: #c9ced6; --muted: #8d949e; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: Figtree, "Segoe UI", system-ui, sans-serif; color: var(--fg); user-select: none; }
  [hidden] { display: none !important; }
  .logo { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--c); color: var(--ink); font-weight: 900; font-size: 16px; flex: none; }
  .glass { background: var(--panel); box-shadow: 0 14px 40px rgba(0, 0, 0, .5), inset 0 0 0 1px var(--line); backdrop-filter: blur(16px); }

  /* Corners: toasts, cheat sheet and HUD each sit in one. */
  .corner { position: fixed; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .corner.top { top: 16px; left: 50%; transform: translateX(-50%); align-items: center; }
  .corner.top-left { top: 16px; left: 16px; align-items: flex-start; }
  .corner.top-right { top: 16px; right: 16px; align-items: flex-end; }
  .corner.bottom-left { bottom: 64px; left: 16px; align-items: flex-start; flex-direction: column-reverse; }
  .corner.bottom-right { bottom: 64px; right: 16px; align-items: flex-end; flex-direction: column-reverse; }

  /* Toasts */
  .note { display: flex; align-items: center; gap: 12px; min-width: 250px; padding: 10px 14px 10px 10px; border-radius: 18px; animation: in .22s ease-out; transition: opacity .3s, transform .3s; position: relative; overflow: hidden; }
  .note.out { opacity: 0; transform: translateY(-6px) scale(.98); }
  .note .t { display: flex; flex-direction: column; line-height: 1.2; flex: 1; min-width: 0; }
  .note .t b { font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note .t span { font-size: 12px; color: var(--muted); font-weight: 600; }
  .note .v { padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 800; background: rgba(255, 255, 255, .1); white-space: nowrap; }
  .note .v.on { background: var(--c); color: var(--ink); }
  .note .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--c); border-radius: 0 3px 3px 0; transition: width .25s; }
  .note .ic { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgba(255, 255, 255, .08); color: var(--muted); flex: none; }
  .note.is-on .ic { background: var(--c); color: var(--ink); }
  .card .mi { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; background: rgba(255, 255, 255, .07); color: var(--muted); }
  .card.on .mi { background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); }

  /* Cheat sheet */
  #sheet { width: 400px; max-height: 70vh; overflow: hidden; padding: 12px; border-radius: 20px; animation: in .16s ease-out; }
  #sheet .hd, #hud .hd { display: flex; align-items: center; gap: 10px; }
  #sheet .hd { margin: 0 2px 8px; }
  .hd .t { display: flex; flex-direction: column; line-height: 1.2; }
  .hd .t b { font-size: 14px; font-weight: 800; }
  .hd .t span { font-size: 12px; color: var(--muted); font-weight: 600; }
  #sheet .r { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 9px; font-size: 13px; font-weight: 600; }
  #sheet .r.on { background: rgba(255, 255, 255, .06); }
  #sheet .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--soft); }
  #sheet .r.on .n { color: #fff; }
  #sheet .val { font-size: 11px; font-weight: 800; color: var(--muted); }
  #sheet .r.on .val { color: var(--c); }
  kbd { font: inherit; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: rgba(255, 255, 255, .1); color: var(--fg); white-space: nowrap; }

  /* HUD */
  #hud { padding: 8px 12px 8px 8px; border-radius: 16px; display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
  #hud .logo { width: 24px; height: 24px; border-radius: 8px; font-size: 13px; }
  #hud .stats { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; color: var(--soft); white-space: nowrap; }
  #hud .stats b { color: var(--fg); font-weight: 800; }
  #hud .stats .dim { color: var(--muted); font-weight: 600; }
  #hud .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  #hud .chips span { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 7px; background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f3b73f; flex: none; }
  .dot.ok { background: #3ddc84; box-shadow: 0 0 0 3px rgba(61, 220, 132, .2); }

  /* Menu */
  #shade { position: fixed; inset: 0; background: rgba(5, 6, 8, .45); animation: fade .15s ease-out; }
  #menu { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(860px, calc(100vw - 80px)); max-height: min(720px, calc(100vh - 100px)); display: flex; flex-direction: column; border-radius: 24px; animation: pop .16s ease-out; }
  .m-head { display: flex; align-items: center; gap: 12px; padding: 18px 18px 12px; }
  .m-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
  .m-title b { font-size: 19px; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-title span { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 3px; }
  .btn { height: 34px; padding: 0 13px; border: 0; border-radius: 11px; background: rgba(255, 255, 255, .09); color: var(--fg); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: rgba(255, 255, 255, .16); }
  .btn.on { background: var(--c); color: var(--ink); }
  .btn.danger:hover { background: #e5484d; }
  .btn.round { width: 34px; padding: 0; justify-content: center; }
  /* The two views: HotSwap's mods and Discord. The open one is outlined. */
  .view { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 11px; background: none; cursor: pointer; display: grid; place-items: center; flex: none; box-shadow: 0 0 0 2px transparent; transition: box-shadow .15s, opacity .15s; opacity: .55; }
  .view:hover { opacity: .85; }
  .view.on { box-shadow: 0 0 0 2px #fff; opacity: 1; }
  .view.dc { background: #5865f2; }
  .dc-panel { display: flex; flex-direction: column; gap: 10px; padding: 4px 18px 18px; }
  .dc-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, .05); }
  .dc-row .t { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
  .dc-row .t b { font-size: 15px; }
  .dc-row .t span { font-size: 12px; color: var(--muted); }
  .dc-row kbd { font: inherit; font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 9px; background: rgba(255, 255, 255, .1); cursor: pointer; }
  .dc-row kbd.rec { background: #5865f2; }
  .dc-note { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 4px 2px 0; }
  .dc-call { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; background: rgba(88, 101, 242, .12); }
  .dc-call .hd2 { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: var(--soft); }
  .dc-call .hd2 .sp { flex: 1; }
  .dc-ppl { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
  .dc-p { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 11px; background: rgba(255, 255, 255, .05); min-width: 0; }
  .dc-p img { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px transparent; transition: box-shadow .1s; }
  .dc-p.talk img { box-shadow: 0 0 0 2px #23a55a; }
  .dc-p b { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dc-p .ic { font-size: 11px; font-weight: 800; color: #f23f43; }
  .btn.red { background: #f23f43; color: #fff; }
  .btn.sm { height: 26px; padding: 0 9px; border-radius: 8px; font-size: 11px; }
  .dc-p { flex-wrap: wrap; }
  .dc-p .vol { flex-basis: 100%; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 700; }
  .dc-p .vol input { flex: 1; height: 18px; }
  .dc-p.lm b { text-decoration: line-through; color: var(--muted); }
  .dc-set { display: grid; grid-template-columns: auto 1fr 44px; align-items: center; gap: 6px 10px; padding: 10px 14px; border-radius: 14px; background: rgba(255, 255, 255, .05); font-size: 12px; font-weight: 800; color: var(--soft); }
  .dc-set .val { text-align: right; color: var(--muted); }
  .dc-chs { display: flex; flex-wrap: wrap; gap: 6px; }
  .dc-chs button { height: 28px; padding: 0 10px; border: 0; border-radius: 9px; background: rgba(255, 255, 255, .07); color: var(--soft); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .dc-chs button:hover { background: rgba(255, 255, 255, .14); }
  .dc-chs button.on { background: #5865f2; color: #fff; }
  .dc-set select { grid-column: 2 / 4; min-width: 0; height: 30px; border: 0; border-radius: 9px; padding: 0 8px; background: rgba(255, 255, 255, .08); color: var(--fg); font: inherit; font-size: 12px; font-weight: 700; }
  .dc-set select option { background: #16181d; }
  .dc-set .chips2 { grid-column: 2 / 4; display: flex; gap: 6px; }
  .dc-set .chips2 button { flex: 1; height: 28px; border: 0; border-radius: 9px; background: rgba(255, 255, 255, .07); color: var(--soft); font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; }
  .dc-set .chips2 button.on { background: #5865f2; color: #fff; }
  .dc-h { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 4px 2px 0; }
  /* Who's talking, under the HUD. */
  #talk { display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 16px; }
  #talk span { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; padding: 3px 10px 3px 3px; border-radius: 14px; background: rgba(35, 165, 90, .18); }
  #talk img { width: 24px; height: 24px; border-radius: 50%; box-shadow: 0 0 0 2px #23a55a; }
  #hud .talk { display: flex; flex-wrap: wrap; gap: 6px; }
  #hud .talk span { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; padding: 2px 8px 2px 2px; border-radius: 12px; background: rgba(35, 165, 90, .18); }
  #hud .talk img { width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 0 2px #23a55a; }
  .note .dci { width: 32px; height: 32px; border-radius: 50%; flex: none; background: #5865f2; display: grid; place-items: center; overflow: hidden; }
  .note .dci img { width: 100%; height: 100%; object-fit: cover; }
  .note .t span.body { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
  .m-bar { display: flex; align-items: center; gap: 8px; padding: 0 18px 12px; flex-wrap: wrap; }
  .tab { height: 30px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
  .tab:hover { color: var(--fg); background: rgba(255, 255, 255, .06); }
  .tab.on { background: rgba(255, 255, 255, .12); color: var(--fg); }
  .tab .n { color: var(--muted); font-weight: 700; margin-left: 4px; }
  .sp { flex: 1; }
  .pf { height: 30px; padding: 0 11px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 800; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); }
  .pf:hover { color: var(--fg); }
  .pf.on { color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c); }
  .m-grid { flex: 1; overflow-y: auto; padding: 4px 14px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .m-grid::-webkit-scrollbar { width: 8px; } .m-grid::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 8px; }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 12px 14px; border-radius: 15px; background: rgba(255, 255, 255, .04); box-shadow: inset 0 0 0 1px transparent; transition: background .12s, box-shadow .12s; cursor: pointer; }
  .card:hover { background: rgba(255, 255, 255, .07); }
  .card.sel { box-shadow: inset 0 0 0 1.5px var(--c); }
  .card.on { background: color-mix(in srgb, var(--c) 13%, rgba(255, 255, 255, .04)); }
  .card.locked { opacity: .45; cursor: not-allowed; }
  .card .row { display: flex; align-items: center; gap: 10px; }
  .card .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .info { font-size: 12px; color: var(--muted); font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sw { width: 44px; height: 26px; border-radius: 13px; background: rgba(255, 255, 255, .14); position: relative; flex: none; transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .card.on .sw { background: var(--c); }
  .card.on .sw::after { transform: translateX(18px); }
  .val { min-width: 44px; text-align: right; font-size: 13px; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--c) var(--p, 0%), rgba(255, 255, 255, .14) var(--p, 0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .5); }
  .apply { height: 28px; padding: 0 12px; border-radius: 9px; background: rgba(255, 255, 255, .12); font-size: 12px; font-weight: 800; flex: none; display: grid; place-items: center; }
  .card:hover .apply, .card.sel .apply { background: var(--c); color: var(--ink); }
  .m-foot { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); font-weight: 600; }
  .m-foot b { color: var(--soft); }
  .empty { grid-column: 1 / -1; padding: 30px; text-align: center; color: var(--muted); font-weight: 600; }

  @keyframes in { from { opacity: 0; transform: translateY(-8px) scale(.97); } }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } }
  @keyframes fade { from { opacity: 0; } }
</style></head>
<body>
<div id="toasts" class="corner top"></div>
<div id="sheetBox" class="corner top"><div id="sheet" class="glass" hidden></div></div>
<div id="hudBox" class="corner top-left"><div id="hud" class="glass" hidden></div><div id="talk" class="glass" hidden></div></div>
<div id="shade" hidden></div>
<div id="menu" class="glass" hidden></div>
<script>
  const { invoke } = window.__TAURI__.core;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = id => document.getElementById(id);
  const send = input => invoke('overlay_input', { input }).catch(() => {});
  const fmtTime = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : `${m}:${String(s % 60).padStart(2, '0')}`; };
  const clock = () => new Date().toTimeString().slice(0, 5);
  const logo = size => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><rect x="1" y="1" width="22" height="22" rx="7" fill="var(--c)"/><path d="M6.5 9.5h10l-3-3M17.5 14.5h-10l3 3" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const DISCORD = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>';
  let view = 'mods';
  // Discord voice (beta): connects as Discord's StreamKit overlay; on once the user opts in.
  let voice = null;
  const voiceOn = () => { try { return localStorage.getItem('hs.dc.voice') === '1'; } catch { return false; } };
  const voiceOpt = on => { try { localStorage.setItem('hs.dc.voice', on ? '1' : '0'); } catch {} };
  if (voiceOn()) invoke('voice_start').catch(() => {});
  setInterval(async () => {
    if (!voiceOn() || dragging || document.activeElement?.tagName === 'SELECT') return;
    const v = await invoke('voice_state').catch(() => null);
    if (JSON.stringify(v) === JSON.stringify(voice)) return;
    voice = v;
    if (menu && view === 'discord') renderMenu();
    if (hud) renderHud();
  }, 400);
  const BOLT = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>';

  function theme(p) {
    if (p.accent) document.documentElement.style.setProperty('--c', p.accent);
    if (p.ink) document.documentElement.style.setProperty('--ink', p.ink);
    if (p.corner) $('toasts').className = $('sheetBox').className = 'corner ' + p.corner;
    if (p.hudCorner) $('hudBox').className = 'corner ' + p.hudCorner;
  }

  /* ---------- Toasts ---------- */
  function toast(p) {
    if (p.kind === 'discord') return dcToast(p);
    const n = document.createElement('div');
    n.className = 'note glass' + (p.on ? ' is-on' : '');
    n.innerHTML = `<span class="ic">${modIcon(p.title)}</span><span class="t"><b>${esc(p.title)}</b><span>${esc(p.game)}</span></span><span class="v${p.on ? ' on' : ''}">${esc(p.value)}</span>`
      + (p.pct != null ? `<span class="bar" style="width:${Math.max(2, Math.min(100, p.pct))}%"></span>` : '');
    $('toasts').prepend(n);
    while ($('toasts').children.length > 4) $('toasts').lastChild.remove();
    setTimeout(() => { n.classList.add('out'); setTimeout(() => n.remove(), 320); }, 2400);
  }

  // A Discord notification (a message or ping), shown like a mod toast but a bit longer.
  function dcToast(p) {
    const n = document.createElement('div');
    n.className = 'note glass';
    n.innerHTML = `<span class="dci">${p.icon ? `<img src="${esc(p.icon)}" alt="">` : DISCORD}</span><span class="t"><b>${esc(p.title)}</b><span class="body">${esc(p.body)}</span></span>`;
    $('toasts').prepend(n);
    while ($('toasts').children.length > 4) $('toasts').lastChild.remove();
    setTimeout(() => { n.classList.add('out'); setTimeout(() => n.remove(), 320); }, 5000);
  }

  // Mod icons, picked from the mod's name (first match wins; the bolt otherwise).
  const ICON_PATHS = {
    heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',
    food: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
    drink: '<path d="M6 8l1.75 12.28a2 2 0 0 0 2 1.72h4.54a2 2 0 0 0 2-1.72L18 8M5 8h14M7 15a6.47 6.47 0 0 1 5 0 6.47 6.47 0 0 0 5 0M12 8l1-6h2"/>',
    air: '<path d="M12.8 19.6A2 2 0 1 0 14 16H2M17.5 8a2.5 2.5 0 1 1 2 4H2M9.8 4.4A2 2 0 1 1 11 8H2"/>',
    battery: '<rect x="2" y="7" width="16" height="10" rx="2"/><path d="M22 11v2M6 11v2M10 11v2"/>',
    fuel: '<path d="M3 22h12M4 9h10M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.83a2 2 0 0 0-.59-1.42L18 5"/>',
    money: '<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2s1.3 1.7 3 2 3 .9 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>',
    speed: '<path d="M12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"/>',
    jump: '<path d="M12 19V5M5 12l7-7 7 7"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
    cold: '<path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/>',
    build: '<path d="M2 20h20M5 20V9l7-5 7 5v11M9 20v-6h6v6"/>',
    flask: '<path d="M9 3h6M10 3v6L4 20a1 1 0 0 0 .9 1.5h14.2A1 1 0 0 0 20 20l-6-11V3"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>',
    smile: '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5V8ZM3 8l9 5 9-5M12 13v8"/>',
    star: '<path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  };
  const ICON_RULES = [
    [/health|invincib|immortal|god mode|no damage|heal/i, 'heart'],
    [/hunger|food|calorie|poutine|eat/i, 'food'],
    [/thirst|water|drink|syrup/i, 'drink'],
    [/oxygen|breath|air/i, 'air'],
    [/fuel|gas/i, 'fuel'],
    [/battery|energy|power|electric/i, 'battery'],
    [/money|cash|\$|fund|credit|coin|cost|price/i, 'money'],
    [/jump/i, 'jump'],
    [/speed|walk|run|swim|sprint|fast|movement/i, 'speed'],
    [/always day|daylight|noon/i, 'sun'],
    [/time|clock|day|night/i, 'clock'],
    [/sleep|fatigue|stamina|tired/i, 'moon'],
    [/freez|cold|temperature|heat/i, 'cold'],
    [/build|construct|place/i, 'build'],
    [/research|science|tech|unlock|blueprint|scan/i, 'flask'],
    [/stress|anxiety|sanity|mood|passive|peaceful/i, 'smile'],
    [/crush|pressure|armor|shield|protect|crash|derby|damage/i, 'shield'],
    [/teleport|waypoint|position/i, 'pin'],
    [/item|inventory|resource|craft|stack|cargo|grab|throw/i, 'box'],
    [/reputation|xp|level|star/i, 'star'],
    [/radar|map|reveal|visib|see/i, 'eye'],
  ];
  function modIcon(name, size = 16) {
    const k = ICON_RULES.find(([re]) => re.test(name || ''))?.[1];
    return k ? `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[k]}</svg>` : BOLT;
  }

  /* ---------- Cheat sheet ---------- */
  let sheetTimer;
  function sheet(p) {
    clearTimeout(sheetTimer);
    $('sheet').hidden = !p.show;
    if (!p.show) return;
    $('sheet').innerHTML = `<div class="hd">${logo(28)}<span class="t"><b>Hotkeys</b><span>${esc(p.game)}</span></span></div>`
      + p.items.map(i => `<div class="r${i.on ? ' on' : ''}"><span class="n">${esc(i.name)}</span><span class="val">${esc(i.value)}</span>${i.keys.map(k => `<kbd>${esc(k)}</kbd>`).join('')}</div>`).join('');
    sheetTimer = setTimeout(() => { $('sheet').hidden = true; }, 10000); // in case the key release never arrives
  }

  /* ---------- HUD ---------- */
  let hud = null;
  function renderHud() {
    $('hud').hidden = !hud;
    if (!hud) return;
    const parts = [
      `<b>${esc(hud.game)}</b>`,
      `<span>${hud.count} mod${hud.count === 1 ? '' : 's'} on</span>`,
      hud.start ? `<span class="dim">${fmtTime(Date.now() - hud.start)}</span>` : '',
      hud.cpu != null ? `<span class="dim">CPU ${Math.round(hud.cpu)}%</span>` : '',
      hud.ram != null ? `<span class="dim">RAM ${Math.round(hud.ram)}%</span>` : '',
      `<span class="dim">${clock()}</span>`,
    ].filter(Boolean).join('');
    $('hud').innerHTML = `<div class="hd">${logo(24)}<span class="dot${hud.connected ? ' ok' : ''}"></span><div class="stats">${parts}</div></div>`
      + (voice?.status === 'ready' && voice.members.some(m => m.speaking) ? `<div class="talk">${voice.members.filter(m => m.speaking).map(m => `<span><img src="${esc(m.avatar)}" alt="">${esc(m.name)}</span>`).join('')}</div>` : '')
      + (hud.mods?.length ? `<div class="chips">${hud.mods.slice(0, 8).map(m => `<span>${esc(m)}</span>`).join('')}${hud.mods.length > 8 ? `<span>+${hud.mods.length - 8}</span>` : ''}</div>` : '');
  }
  setInterval(() => { if (hud) renderHud(); if (menu) renderFoot(); }, 1000);

  /* ---------- Menu ---------- */
  let menu = null, tab = 'all', sel = 0, dragging = false;
  function visibleMods() {
    if (!menu) return [];
    const all = menu.cats.flatMap(c => c.mods.map(m => ({ ...m, cat: c.name })));
    if (tab === 'all') return [...all.filter(m => m.pinned), ...all.filter(m => !m.pinned)];
    return all.filter(m => m.cat === tab);
  }
  function renderMenu() {
    const open = !!menu;
    $('menu').hidden = $('shade').hidden = !open;
    if (!open) return;
    if (dragging) return; // don't rebuild under a slider being dragged
    if (tab !== 'all' && !menu.cats.some(c => c.name === tab)) tab = 'all';
    const mods = visibleMods();
    sel = Math.max(0, Math.min(sel, mods.length - 1));
    const status = menu.paused ? 'Mods paused' : menu.connected ? 'Live in the game' : (menu.message || 'Connecting…');
    $('menu').innerHTML = `
      <div class="m-head">${menu.discordOnly ? logo(34) : `<button class="view${view === 'mods' ? ' on' : ''}" data-view="mods" title="Mods">${logo(34)}</button>`}<button class="view dc${view === 'discord' ? ' on' : ''}" data-view="discord" title="Discord">${DISCORD}</button>
        ${menu.discordOnly ? `<div class="m-title"><b>Discord</b><span>${esc(menu.game)}</span></div>` : `<div class="m-title"><b>${esc(menu.game)}</b><span><span class="dot${menu.connected && !menu.paused ? ' ok' : ''}"></span>${esc(status)} · ${menu.count} on</span></div>
        <button class="btn${menu.paused ? ' on' : ''}" data-cmd="pause">${menu.paused ? 'Resume' : 'Pause'}</button>
        <button class="btn danger" data-cmd="panic">All off</button>`}
        <button class="btn round" data-cmd="close" title="Close (${esc(menu.menuKey)})">✕</button></div>
      ${view === 'discord' ? discordPanel() : `<div class="m-bar">
        <button class="tab${tab === 'all' ? ' on' : ''}" data-tab="all">All</button>
        ${menu.cats.map(c => `<button class="tab${tab === c.name ? ' on' : ''}" data-tab="${esc(c.name)}">${esc(c.name)}<span class="n">${c.mods.length}</span></button>`).join('')}
        <span class="sp"></span>
        ${menu.profiles.length > 1 ? menu.profiles.map(p => `<button class="pf${p === menu.profile ? ' on' : ''}" data-profile="${esc(p)}">${esc(p)}</button>`).join('') : ''}
      </div>
      <div class="m-grid">${mods.map((m, i) => card(m, i)).join('') || '<div class="empty">No mods here.</div>'}</div>`}
      <div class="m-foot" id="mFoot"></div>`;
    renderFoot();
    $('menu').querySelector('.card.sel')?.scrollIntoView({ block: 'nearest' });
  }
  function voicePanel() {
    if (!voiceOn()) return `<div class="dc-row"><div class="t"><b>See your call (beta)</b><span>Who’s in your voice channel, who’s talking, and real mute and deafen. Discord only lets its approved apps do this, so HotSwap connects as Discord’s own StreamKit overlay: Discord will ask once to authorize “StreamKit”. Unofficial, so it may stop working if Discord changes it.</span></div><button class="btn" data-voice="on">Connect</button></div>`;
    const v = voice || { status: 'connecting', message: 'Connecting…', members: [] };
    if (v.status !== 'ready') return `<div class="dc-row"><div class="t"><b>${v.status === 'error' ? 'Discord voice: not connected' : v.status === 'authorizing' ? 'Check Discord' : 'Connecting…'}</b><span>${esc(v.message)}</span></div><button class="btn" data-voice="off">Turn off</button></div>`;
    const pct = (x, max) => `--p:${(x / max * 100).toFixed(1)}%`;
    const ppl = v.members.map(m => {
      const me = m.id === v.me;
      return `<div class="dc-p${m.speaking ? ' talk' : ''}${m.local_mute ? ' lm' : ''}"><img src="${esc(m.avatar)}" alt=""><b>${esc(m.name)}</b>${m.deaf ? '<span class="ic">DEAF</span>' : m.mute ? '<span class="ic">MUTED</span>' : ''}
        ${me ? '' : `<button class="btn sm${m.local_mute ? ' red' : ''}" data-umute="${esc(m.id)}" title="Mute this person for you only">${m.local_mute ? 'Unmute' : 'Mute'}</button>
        <div class="vol"><input type="range" min="0" max="200" step="5" value="${Math.round(m.volume)}" style="${pct(m.volume, 200)}" data-uvol="${esc(m.id)}"><span class="val">${Math.round(m.volume)}%</span></div>`}</div>`;
    }).join('');
    const chs = v.channels.map(c => `<button class="${c.id === v.channel_id ? 'on' : ''}" data-join="${esc(c.id)}">🔊 ${esc(c.name)}</button>`).join('');
    return `<div class="dc-call"><div class="hd2">${v.channel ? `🔊 ${esc(v.channel)}` : 'Not in a voice channel'}<span class="sp"></span>
        <button class="btn${v.mute ? ' red' : ''}" data-vset="mute">${v.mute ? 'Unmute' : 'Mute'}</button><button class="btn${v.deaf ? ' red' : ''}" data-vset="deaf">${v.deaf ? 'Undeafen' : 'Deafen'}</button>
        ${v.channel ? '<button class="btn red" data-leave="1" title="Leave the voice channel">Leave</button>' : ''}</div>
        ${ppl ? `<div class="dc-ppl">${ppl}</div>` : ''}</div>
      ${chs ? `<p class="dc-h">Switch channel</p><div class="dc-chs">${chs}</div>` : ''}
      <p class="dc-h">Your audio</p>
      <div class="dc-set"><span>Mic</span><input type="range" min="0" max="100" step="1" value="${Math.round(v.input_volume)}" style="${pct(v.input_volume, 100)}" data-gvol="input"><span class="val">${Math.round(v.input_volume)}%</span>
        <span>Headphones</span><input type="range" min="0" max="200" step="1" value="${Math.round(v.output_volume)}" style="${pct(v.output_volume, 200)}" data-gvol="output"><span class="val">${Math.round(v.output_volume)}%</span>
        <span>Noise suppression</span><span></span><button class="btn sm${v.noise ? ' on' : ''}" data-noise="1">${v.noise ? 'On' : 'Off'}</button>
        <span>Input mode</span><div class="chips2">${[['VOICE_ACTIVITY', 'Voice activity'], ['PUSH_TO_TALK', 'Push to talk']].map(([k, l]) => `<button class="${v.mode === k ? 'on' : ''}" data-vmode="${k}">${l}</button>`).join('')}</div>
        ${v.inputs?.length ? `<span>Microphone</span><select data-vdev="input">${v.inputs.map(d => `<option value="${esc(d.id)}"${d.id === v.input_device ? ' selected' : ''}>${esc(d.name)}</option>`).join('')}</select>` : ''}
        ${v.outputs?.length ? `<span>Output</span><select data-vdev="output">${v.outputs.map(d => `<option value="${esc(d.id)}"${d.id === v.output_device ? ' selected' : ''}>${esc(d.name)}</option>`).join('')}</select>` : ''}</div>
      <div class="dc-row"><div class="t"><b>Discord voice (beta)</b><span>Connected as Discord’s StreamKit overlay. Notifications show as toasts.</span></div><button class="btn" data-voice="off">Turn off</button></div>`;
  }
  function discordPanel() {
    return `<div class="dc-panel">${voicePanel()}</div>`;
  }
  function card(m, i) {
    const locked = !m.live || menu.paused;
    const pct = m.type === 'slider' ? ((m.value - m.min) / (m.max - m.min) * 100).toFixed(1) + '%' : '';
    const ctl = m.type === 'toggle' ? '<span class="sw"></span>'
      : m.type === 'slider' ? `<span class="val">${esc(m.shown)}</span>` : '<span class="apply">Apply</span>';
    const keys = m.keys.map(k => `<kbd>${esc(k)}</kbd>`).join('');
    return `<div class="card${m.on ? ' on' : ''}${i === sel ? ' sel' : ''}${locked ? ' locked' : ''}" data-i="${i}">
      <div class="row"><span class="mi">${modIcon(m.name, 15)}</span><span class="nm">${m.pinned ? '📌 ' : ''}${esc(m.name)}</span>${keys}${ctl}</div>
      ${m.type === 'slider' ? `<input type="range" min="${m.min}" max="${m.max}" step="${m.step}" value="${m.value}" style="--p:${pct}" data-range="${i}"${locked ? ' disabled' : ''}>` : ''}
      ${m.info && m.type !== 'slider' ? `<span class="info">${esc(m.info)}</span>` : ''}</div>`;
  }
  function renderFoot() {
    const f = $('mFoot');
    if (!f || !menu) return;
    f.innerHTML = `<span><b>↑↓←→</b> move · <b>Enter</b> toggle · <b>←→</b> slider · <b>Tab</b> category · <b>Esc</b> close</span><span class="sp"></span>`
      + (menu.start ? `<span>Session <b>${fmtTime(Date.now() - menu.start)}</b></span>` : '') + `<span><b>${clock()}</b></span>`;
  }
  function activate(i) {
    const m = visibleMods()[i];
    if (!m || !m.live || menu.paused) return;
    sel = i;
    if (m.type === 'toggle') send({ type: 'set', id: m.id, value: !m.on });
    else if (m.type === 'action') send({ type: 'act', id: m.id });
  }
  function nudge(dir) {
    const m = visibleMods()[sel];
    if (!m || m.type !== 'slider' || !m.live || menu.paused) return false;
    send({ type: 'set', id: m.id, value: Math.min(m.max, Math.max(m.min, m.value + dir * m.step)) });
    return true;
  }

  document.addEventListener('click', e => {
    if (!menu) return;
    const t = e.target;
    if (t.matches('input[type=range]')) return;
    const v = t.closest('[data-view],[data-rec],[data-dc],[data-voice],[data-vset],[data-umute],[data-join],[data-leave],[data-noise],[data-vmode]');
    if (v) {
      if (v.dataset.voice) { const on = v.dataset.voice === 'on'; voiceOpt(on); voice = null; invoke(on ? 'voice_start' : 'voice_stop').catch(() => {}); }
      else if (v.dataset.vset) { const k = v.dataset.vset; if (voice) { voice[k] = !voice[k]; dcSend('SET_VOICE_SETTINGS', { [k]: voice[k] }); } }
      else if (v.dataset.umute) { const m = voice?.members.find(x => x.id === v.dataset.umute); if (m) { m.local_mute = !m.local_mute; dcSend('SET_USER_VOICE_SETTINGS', { user_id: m.id, mute: m.local_mute }); } }
      else if (v.dataset.join) dcSend('SELECT_VOICE_CHANNEL', { channel_id: v.dataset.join, force: true });
      else if (v.dataset.leave) dcSend('SELECT_VOICE_CHANNEL', { channel_id: null });
      else if (v.dataset.vmode) { if (voice) { voice.mode = v.dataset.vmode; dcSend('SET_VOICE_SETTINGS', { mode: { type: v.dataset.vmode } }); } }
      else if (v.dataset.noise) { if (voice) { voice.noise = !voice.noise; dcSend('SET_VOICE_SETTINGS', { noise_suppression: voice.noise }); } }
      else if (v.dataset.view) view = v.dataset.view;
      return renderMenu();
    }
    const b = t.closest('[data-cmd],[data-tab],[data-profile],.card');
    if (!b) { if (t.id === 'shade') send({ type: 'close' }); return; }
    if (b.dataset.cmd) send({ type: b.dataset.cmd });
    else if (b.dataset.tab) { tab = b.dataset.tab; sel = 0; renderMenu(); }
    else if (b.dataset.profile) send({ type: 'profile', name: b.dataset.profile });
    else activate(+b.dataset.i);
  });
  $('shade').addEventListener('click', () => send({ type: 'close' }));
  const dcSend = (cmd, args) => invoke('voice_send', { cmd, args }).catch(() => {});
  // Discord volume sliders: a person's volume, or your mic and headphones.
  document.addEventListener('input', e => {
    const d = e.target.dataset;
    if (!d.uvol && !d.gvol) return;
    dragging = true;
    e.target.style.setProperty('--p', (e.target.value / e.target.max * 100).toFixed(1) + '%');
    if (e.target.nextElementSibling?.classList.contains('val')) e.target.nextElementSibling.textContent = e.target.value + '%';
  });
  // Picking a microphone or output device.
  document.addEventListener('change', e => {
    const k = e.target.dataset.vdev;
    if (!k) return;
    if (voice) voice[k + '_device'] = e.target.value;
    dcSend('SET_VOICE_SETTINGS', { [k]: { device_id: e.target.value } });
  });
  document.addEventListener('change', e => {
    const d = e.target.dataset;
    if (!d.uvol && !d.gvol) return;
    dragging = false;
    const x = parseFloat(e.target.value);
    if (d.uvol) { const m = voice?.members.find(m => m.id === d.uvol); if (m) m.volume = x; dcSend('SET_USER_VOICE_SETTINGS', { user_id: d.uvol, volume: x }); }
    else { if (voice) voice[d.gvol + '_volume'] = x; dcSend('SET_VOICE_SETTINGS', { [d.gvol]: { volume: x } }); }
  });
  document.addEventListener('input', e => {
    if (!e.target.dataset.range) return;
    dragging = true;
    const m = visibleMods()[+e.target.dataset.range];
    e.target.style.setProperty('--p', ((e.target.value - m.min) / (m.max - m.min) * 100).toFixed(1) + '%');
    e.target.closest('.card').querySelector('.val').textContent = e.target.value;
  });
  document.addEventListener('change', e => {
    if (!e.target.dataset.range) return;
    dragging = false;
    const m = visibleMods()[+e.target.dataset.range];
    send({ type: 'set', id: m.id, value: parseFloat(e.target.value) });
  });
  document.addEventListener('keydown', e => {
    if (!menu) return;
    if (view === 'discord') { if (e.key === 'Escape') send({ type: 'close' }); return; }
    const n = visibleMods().length;
    const k = e.key;
    if (k === 'Escape') send({ type: 'close' });
    else if (k === 'ArrowDown') sel = Math.min(n - 1, sel + 2);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - 2);
    else if (k === 'ArrowRight') { if (!nudge(1)) sel = Math.min(n - 1, sel + 1); }
    else if (k === 'ArrowLeft') { if (!nudge(-1)) sel = Math.max(0, sel - 1); }
    else if (k === 'Enter' || k === ' ') activate(sel);
    else if (k === 'Tab') {
      const tabs = ['all', ...menu.cats.map(c => c.name)];
      tab = tabs[(tabs.indexOf(tab) + (e.shiftKey ? -1 : 1) + tabs.length) % tabs.length]; sel = 0;
    } else return;
    e.preventDefault();
    renderMenu();
  });

  window.__TAURI__.event.listen('overlay', ({ payload: p }) => {
    theme(p);
    if (p.kind === 'sheet') return sheet(p);
    if (p.kind === 'hud') { hud = p.data; return renderHud(); }
    if (p.kind === 'talk') {
      $('talk').hidden = !p.members.length;
      $('talk').innerHTML = p.members.map(m => `<span><img src="${esc(m.avatar)}" alt="">${esc(m.name)}</span>`).join('');
      return;
    }
    if (p.kind === 'menu') {
      const was = !!menu;
      menu = p.open ? p.data : null;
      if (menu && !was) { tab = 'all'; sel = 0; dragging = false; view = 'mods'; }
      if (menu?.discordOnly) view = 'discord';
      return renderMenu();
    }
    if (p.kind === 'theme') return;
    toast(p);
  }).then(() => invoke('overlay_ready')).catch(() => {});
</script></body></html>
