[package]
name = "hotswap"
version = "0.3.5+4"
description = "HotSwap desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system", "network"] }

pdb = "0.8"
oozextract = "0.5"
texture2ddecoder = "0.1"
jpeg-encoder = "0.7"
tauri-plugin-updater = "2"
semver = "1"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
sevenz-rust = "0.6"
tungstenite = "0.24"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Performance", "Win32_System_LibraryLoader"] }

[profile.dev]
# Address math on pointers read from another process must wrap, not panic, on junk values.
overflow-checks = false
# Searching a game's memory is far too slow unoptimized.
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
